<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulador de Clima</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" rel="stylesheet" />

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>

    <style>
        body {
            background-color: #f0f8ff;
        }
        .container {
            margin-top: 50px;
        }
        #weatherInfo {
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="container text-center">
        <h1>Simulador de Clima</h1>
        <p>Selecciona una ciudad de Argentina para obtener el clima actual.</p>

        <div class="mb-3">
            <select id="citySelect" class="form-select">
                <!-- Opciones dinámicas -->
            </select>
        </div>

        <button class="btn btn-primary" id="fetchWeatherBtn">Consultar Clima</button>
        <div id="weatherInfo" class="alert alert-info d-none"></div>
        <div id="imageContainer" class="text-center"></div>
    </div>

    <script src="app.js"></script>
</body>
</html>
